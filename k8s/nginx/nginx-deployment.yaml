apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      nodeSelector:
        agentpool: app   # <-- ensures it runs on your user node pool
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80