name: terraform-build

on:
    push:
        branches: 
          - feature/github-actions-ci

        paths:
          - "environments/dev/**"
          - ".github/workflows/terraform-build.yaml"
          - "modules/**"
    
    workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_WORKING_DIR: environments/dev
      
jobs:
    terraform-plan:
        name: Terraform Plan
        runs-on: ubuntu-latest

        defaults:
          run:
            working-directory: ${{env.TF_WORKING_DIR}}

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Az CLI Login
              uses: azure/login@v2
              with:
                client-id: ${{secrets.AZURE_CLIENT_ID}}
                tenant-id: ${{secrets.AZURE_TENANT_ID}}
                subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v4
              with:
                terraform-version: "1.14.6"

            # 3. Check for proper code formatting syntax
            - name: Terraform Format Check
              run: terraform fmt -check -recursive

            # 4. Initialize the workspace and download provider plugins
            - name: Terraform Init
              run: terraform init -input=false

            # 5. Validate the static syntax of your configuration files
            - name: Terraform Validate
              run: terraform validate

            - name: Terraform Plan
              run: terraform plan -no-color -input=false -out=tfplan

            - name: Display Terraform Plan
              run: terraform show -no-color tfplan

            - name: Upload Terraform Plan
              uses: actions/upload-artifact@v4
              with:
                name: terraform-plan-${{github.run_id}}
                path: ${{env.TF_WORKING_DIR}}/tfplan
                retention-days: 1