name: ci-storefront-api

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - feature/github-actions-ci
        paths:
            - "apps/storefront-api/**"
            - ".github/workflows/storefront-api.yaml"
    
    workflow_dispatch:

jobs:
    start_and_test_app:
        runs-on: ubuntu-latest

        defaults:
          run:
            working-directory: apps/storefront-api

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Install python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"

            - name: Install python dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install pytest

            - name: Smoke Test - Start up app
              run: |
                uvicorn app.main:app --host 127.0.0.1 --port 8081 &
                sleep 5
                curl --fail http://127.0.0.1:8081/healthz
                curl --fail http://127.0.0.1:8081/readyz
            
    build_image_push_to_acr:
      permissions:
        contents: read
        id-token: write
        
      runs-on: ubuntu-latest
      needs: start_and_test_app

      defaults:
        run:
          working-directory: apps/storefront-api

      env:
        acr_name: devACR674
        ACR_LOGIN_SERVER: devacr674.azureci.io
        IMAGE_NAME: storefront-api
      
      #github actions OIDC 
      environment:
        name: application-dev

      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Az CLI Login
          uses: azure/login@v2
          with:
            client-id: ${{secrets.AZURE_CLIENT_APP_ID}}
            tenant-id: ${{secrets.AZURE_TENANT_ID}}
            subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}

        - name: Azure ACR Login
          run: |
            az acr login --name "${{ env.acr_name }}"

        - name: Build image and push to acr
          uses: docker/build-push-action@v7
          with:
            context: ./apps/storefront-api
            push: true
            tags: |
              ${{env.ACR_LOGIN_SERVER}}/${{env.IMAGE_NAME}}:${{github.sha}}

    deploy_to_aks:
      permissions:
        contents: read
        id-token: write

      runs-on: ubuntu-latest 

      needs: build_image_push_to_acr

      defaults:
        run:
          working-directory: k8s/apps/deployments

      environment:
        name: application-dev

      env:
        IMAGE_TAG: ${{github.sha}}

      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Azure login
          uses: azure/login@v2
          with:
            client-id: ${{secrets.AZURE_CLIENT_APP_ID}}
            tenant-id: ${{secrets.AZURE_TENANT_ID}}
            subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}

        - name: Get AKS Credentials
          run: |
            az aks get-credentials --resource-group rg-aks-reliability-dev --name dev-aks --overwrite-existing

        - name: Render Kubernetes manifest
          run: |
            sed "s|IMAGE_TAG|${IMAGE_TAG}|g" storefront-api-deployment.yaml > /tmp/storefront-api-deployment.yaml
        
        - name: Apply storefront-api
          run: |
            kubectl apply -f /tmp/storefront-api-deployment.yaml --namespace reliability-lab
            kubectl rollout status deployment/storefront-api --namespace reliability-lab --timeout=180s
              