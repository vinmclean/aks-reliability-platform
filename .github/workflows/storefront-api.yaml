name: ci-storefront-api

on:
    pull_request:
        branches:
          - main       

    push:
        branches:
            - main
        paths:
            - "apps/storefront-api/**"
            - ".github/workflows/storefront-api.yaml"
    
    workflow_dispatch:

jobs:
    detect_changes:
      runs-on: ubuntu-latest

      outputs:
        storefront: ${{ steps.filter.outputs.storefront }}
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Check for file changes
          uses: dorny/paths-filter@v3
          id: filter
          with: 
            filters: |
              storefront:
                - "apps/storefront-api/**"
                - ".github/workflows/storefront-api.yaml"

    start_and_test_app:
        name: Storefront Tests
        
        needs: detect_changes
        if: needs.detect_changes.outputs.storefront == 'true'

        runs-on: ubuntu-latest

        defaults:
          run:
            working-directory: apps/storefront-api

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Install python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"

            - name: Install python dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install pytest

            - name: Smoke Test - Start up app
              run: |
                uvicorn app.main:app --host 127.0.0.1 --port 8081 &
                sleep 5
                curl --fail http://127.0.0.1:8081/healthz
                curl --fail http://127.0.0.1:8081/readyz
    
    check_infrastructure:
      if: github.event_name != 'pull_request'

      permissions:
        contents: read
        id-token: write
      
      runs-on: ubuntu-latest
      
      #Job scope of env vars
      env:
        acr_name: devACR674
        ACR_LOGIN_SERVER: devacr674.azurecr.io
      
      #github actions OIDC 
      environment: 
          name: application-dev
      
      outputs:
        ready: ${{steps.check.outputs.ready}}

      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Az CLI Login
          uses: azure/login@v2
          with:
            client-id: ${{secrets.AZURE_CLIENT_APP_ID}}
            tenant-id: ${{secrets.AZURE_TENANT_ID}}
            subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}
        
        - name: Check infrastructure
          id: check
          shell: bash
          run: |
            ACR_EXISTS=$(az acr show \
            --name devACR674 \
            --query name \
            --output tsv 2>/dev/null || true)

            AKS_STATE=$(az aks show \
            --resource-group rg-aks-reliability-dev \
            --name dev-aks \
            --query provisioningState \
            --output tsv 2>/dev/null || true)

            if [[ -n "$ACR_EXISTS" && "$AKS_STATE" == "Succeeded" ]]; then
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "Infrastructure is ready."
            else
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "Infrastructure is not ready. Run terraform-build first."
              exit 1
            fi

    build_image_push_to_acr:
      needs: 
        - start_and_test_app
        - check_infrastructure

      if: |
        github.event_name != 'pull_request' && needs.check_infrastructure.outputs.ready == 'true'

      permissions:
        contents: read
        id-token: write

      runs-on: ubuntu-latest

      defaults:
        run:
          working-directory: apps/storefront-api

      env:
        acr_name: devACR674
        ACR_LOGIN_SERVER: devacr674.azurecr.io
        IMAGE_NAME: storefront-api
      
      #github actions OIDC 
      environment:
        name: application-dev

      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Az CLI Login
          uses: azure/login@v2
          with:
            client-id: ${{secrets.AZURE_CLIENT_APP_ID}}
            tenant-id: ${{secrets.AZURE_TENANT_ID}}
            subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}

        - name: Azure ACR Login
          run: |
            az acr login --name "${{ env.acr_name }}"

        - name: Build image and push to acr
          uses: docker/build-push-action@v7
          with:
            context: ./apps/storefront-api
            push: true
            tags: |
              ${{env.ACR_LOGIN_SERVER}}/${{env.IMAGE_NAME}}:${{github.sha}}

    deploy_to_aks:
      if: github.event_name != 'pull_request'
      
      permissions:
        contents: read
        id-token: write

      runs-on: ubuntu-latest 

      needs: 
        - build_image_push_to_acr
        - check_infrastructure
      
      concurrency: 
        group: aks-dev
        cancel-in-progress: false

      defaults:
        run:
          working-directory: k8s/apps/deployments

      environment:
        name: application-dev

      env:
        IMAGE_TAG: ${{github.sha}}

      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Azure login
          uses: azure/login@v2
          with:
            client-id: ${{secrets.AZURE_CLIENT_APP_ID}}
            tenant-id: ${{secrets.AZURE_TENANT_ID}}
            subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}

        - name: Get AKS Credentials
          run: |
            az aks get-credentials --resource-group rg-aks-reliability-dev --name dev-aks --overwrite-existing

        - name: Render Kubernetes manifest
          run: |
            sed "s|IMAGE_TAG|${IMAGE_TAG}|g" storefront-api-deployment.yaml > /tmp/storefront-api-deployment.yaml
        
        - name: Apply storefront-api
          run: |
            kubectl apply -f /tmp/storefront-api-deployment.yaml --namespace reliability-lab
            kubectl rollout status deployment/storefront-api --namespace reliability-lab --timeout=180s
              