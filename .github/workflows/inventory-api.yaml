name: ci-inventory-api

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - feature/github-actions-ci
        paths:
            - "apps/inventory-api/**"
            - ".github/workflows/inventory-api.yaml"
    
    workflow_dispatch:

   
jobs:
    build_and_test:
        runs-on: ubuntu-latest

        defaults:
          run:
            working-directory: apps/inventory-api

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Install python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"

            - name: Install python dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install pytest

            - name: Smoke Test - Start up app
              run: |
                uvicorn app.main:app --host 127.0.0.1 --port 8081 &
                sleep 5
                curl --fail http://127.0.0.1:8081/healthz
                curl --fail http://127.0.0.1:8081/readyz


    build_image_push_to_acr:
      permissions:
        contents: read
        id-token: write

      runs-on: ubuntu-latest
      needs: build_and_test
      
      defaults:
        run:
          working-directory: apps/inventory-api
      
      env:
        acr_name: devACR674
        ACR_LOGIN_SERVER: devacr674.azurecr.io
        IMAGE_NAME: inventory-api

      #github actions OIDC 
      environment: 
          name: application-dev
      
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4

        - name: Az CLI Login
          uses: azure/login@v2
          with:
            client-id: ${{secrets.AZURE_CLIENT_APP_ID}}
            tenant-id: ${{secrets.AZURE_TENANT_ID}}
            subscription-id: ${{secrets.AZURE_SUBSCRIPTION_ID}}

        - name: Azure ACR Login
          run: |
            az acr login --name "${{ env.ACR_NAME }}"

        - name: Build image and push to acr
          uses: docker/build-push-action@v7
          with:
            context: ./apps/inventory-api
            push: true
            tags: |
              ${{env.ACR_LOGIN_SERVER}}/${{env.IMAGE_NAME}}:${{github.sha}}
          # run: |
          #   docker build -t ${{env.acr_name}}.azurecr.io/inventory-api:${{github.sha}} .
          #   docker image ls
          #   docker push ${{env.acr_name}}.azurecr.io/inventory-api:${{github.sha}}
          #   az acr repository list --name ${{env.acr_name}} --output table