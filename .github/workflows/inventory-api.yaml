name: ci-inventory-api

on:
    workflow_dispatch:
    pull_request:
        branches:
            - main
    push:
        branches:
            - feature/github-actions-ci

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Set up python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"

            - name: Install python dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install pytest

            - name: Confirm workflow is running
              run: echo "GitHub Actions CI test is working"