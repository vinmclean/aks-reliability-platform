name: ci-inventory-api

on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - feature/github-actions-ci
        paths:
            - "apps/inventory-api/**"
            - ".github/workflows/inventory-api.yaml"
    
    workflow_dispatch:

jobs:
    build_and_test:
        runs-on: ubuntu-latest

        defaults:
          run:
            working-directory: apps/inventory-api

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Install python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"

            - name: Install python dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
                pip install pytest

            - name: Smoke Test - Start up app
              run: |
                uvicorn app.main:app --host 127.0.0.1 --port 8081 &
                sleep 5
                curl --fail http://127.0.0.1:8081/healthz
                curl --fail http://127.0.0.1:8081/readyz

            - name: Build docker image
              run: |
                docker build -t inventory-api-ci:${{github.sha}} .
                docker image ls

    test_azure_connection:
      permissions:
        id-token: write

      runs-on: ubuntu-latest
      steps:
        - name: Az CLI Login
          uses: azure/login@v2
          with:
            client-id: {{secrets.AZURE_CLIENT_ID}}
            tenant-id: {{secrets.AZURE_TENANT_ID}}
            subscription-id: {{secrets.AZURE_SUBSCRIPTION_ID}}

        - name: Azure CLI script
          uses: azure/cli@v2
          with:
            azcliversion: latest
            inlineScript: |
              az account show